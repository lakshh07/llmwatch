[project]
name = "llmwatch-server"
version = "0.1.0"
description = "LLMWatch ingest and query API"
readme = "README.md"
authors = [
    { name = "Lakshay Maini", email = "62194911+lakshh07@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "fastapi>=0.161.1",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
llmwatch-server = "llmwatch_server:main"
llmwatch-migrate = "llmwatch_server.migrate:main"
llmwatch-worker = "llmwatch_server.worker:run"
llmwatch-alerter = "llmwatch_server.alerter:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
