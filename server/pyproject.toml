[project]
name = "llmwatch-server"
version = "0.1.0"
description = "LLMWatch ingest and query API"
readme = "README.md"
authors = [
    { name = "Lakshay Maini", email = "62194911+lakshh07@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
llmwatch-server = "llmwatch_server:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
